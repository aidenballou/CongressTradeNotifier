# .github/workflows/daily-run-main.yml
name: Daily Main Runner

on:
  schedule:
    # every 15 minutes to support queue draining and morning release windows
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: insiders-main-workflow
  cancel-in-progress: false

jobs:
  run-main:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Get previous successful run ID
        id: get-prev-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(gh run list --workflow=daily-run-main.yml --limit 10 --json databaseId,status,conclusion --jq '.[] | select(.status == "completed" and .conclusion == "success" and .databaseId != '"${{ github.run_id }}"') | .databaseId' | head -1)
          echo "run_id=$PREV" >> $GITHUB_OUTPUT

      - name: Restore trades database from previous run
        id: restore-db
        if: steps.get-prev-run.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: trades-db
          run-id: ${{ steps.get-prev-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Restore email lock files
        uses: actions/cache/restore@v4
        with:
          path: .email_sent_*.lock
          key: email-locks-${{ github.run_id }}
          restore-keys: |
            email-locks-

      - name: Check DB restoration status
        id: db-status
        run: |
          if [ -f trades.sqlite3 ]; then
            echo "db_exists=true" >> $GITHUB_OUTPUT
            echo "DB restored from previous run"
          else
            echo "db_exists=false" >> $GITHUB_OUTPUT
            echo "WARNING: No DB from previous run; starting fresh"
          fi

      - name: Run main.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DB_RESTORED: ${{ steps.db-status.outputs.db_exists }}
        run: python src/main.py

      - name: Upload trades database artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trades-db
          path: trades.sqlite3
          retention-days: 90

      - name: Save email lock files
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .email_sent_*.lock
          key: email-locks-${{ github.run_id }}
        continue-on-error: true
